[package]
name = "ft817-monitor"
version = "0.1.0"
description = "Desktop CAT monitor for the Yaesu FT-817 / FT-817ND / FT-818"
authors = ["Yoram (4Z1YR)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ft817_monitor_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = "4"
ft817-cat = { path = "../crates/ft817-cat" }
tauri-plugin-window-state = "2"
