<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>817 Monitor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="theme-amber">
  <main class="bezel">
    <div class="lcd-fit" id="lcd-fit">
    <section class="lcd" id="lcd">
      <div class="row top">
        <span class="tag" id="vfo">VFO A</span>
        <span class="tag" id="band">20m</span>
        <span class="tag mode" id="mode">USB</span>
        <span class="spacer"></span>
        <span class="tag flag" id="busy">BUSY</span>
        <span class="txrx" id="txrx">RX</span>
      </div>

      <div class="freq-wrap">
        <svg id="freq" class="freq" viewBox="0 0 640 110" preserveAspectRatio="xMidYMid meet" aria-label="Frequency"></svg>
        <span class="unit">MHz</span>
      </div>

      <div class="meters" id="rx-meter">
        <div class="meter-row">
          <span class="mlabel">S</span>
          <div class="bar big" id="sbar"></div>
          <span class="mval" id="sval">S0</span>
        </div>
        <div class="scale">
          <span style="--p:1">1</span><span style="--p:3">3</span><span style="--p:5">5</span><span style="--p:7">7</span><span style="--p:9">9</span><span style="--p:11" class="over">+20</span><span style="--p:13" class="over">+40</span><span style="--p:15" class="over">+60</span>
        </div>
      </div>

      <div class="meters hidden" id="tx-meter">
        <div class="meter-row"><span class="mlabel">PO</span><div class="bar" id="po"></div><span class="mval" id="poval">0</span></div>
        <div class="meter-row"><span class="mlabel">SWR</span><div class="bar" id="swr"></div><span class="mval" id="swrval">—</span></div>
        <div class="meter-row"><span class="mlabel">ALC</span><div class="bar" id="alc"></div><span class="mval" id="alcval">—</span></div>
        <div class="meter-row"><span class="mlabel">MOD</span><div class="bar" id="mod"></div><span class="mval" id="modval">—</span></div>
      </div>

      <div class="row flags" id="flags"></div>

      <div class="nolink hidden" id="nolink">
        <div class="nolink-title" id="nolink-title">NO LINK</div>
        <div class="nolink-msg" id="nolink-msg"></div>
        <div class="nolink-status" id="nolink-status"></div>
      </div>
    </section>
    </div>

    <footer class="status">
      <span class="dot" id="dot"></span>
      <span id="link-text">Stopped</span>
      <span class="sep">·</span>
      <span id="source">Not connected</span>
      <span class="spacer"></span>
      <span id="rate"></span>
      <button class="btn" id="connect-btn">Connect</button>
      <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings">⚙</button>
    </footer>
  </main>


  <script src="segments.js"></script>
  <script src="app.js"></script>
</body>
</html>
