[package]
name = "ft817-eeprom"
version = "0.1.0"
description = "EEPROM backup and restore for the Yaesu FT-817 / FT-817ND / FT-818"
authors = ["Yoram (4Z1YR)"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ft817_eeprom_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ft817-cat = { path = "../../crates/ft817-cat" }
